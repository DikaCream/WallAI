<svg xmlns="http://www.w3.org/2000/svg" width="700" height="190" viewBox="0 0 700 190" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Illustration: a pending post with live GenLayer consensus status</title>
  <rect width="700" height="190" fill="#09090f"/>
  <rect x="12.5" y="12.5" width="675" height="165" rx="16" fill="#111118" stroke="#8b5cf6" stroke-opacity="0.45" stroke-dasharray="6 4"/>
  <circle cx="44" cy="44" r="14" fill="#7c3aed"/>
  <text x="44" y="49" font-size="13" font-weight="600" fill="#ede9fe" text-anchor="middle">D</text>
  <text x="68" y="42" font-size="14" fill="#d4d4d8">@demo_bb9e</text>
  <rect x="160" y="29" width="158" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.18"/>
  <text x="239" y="42" font-size="10" font-weight="600" fill="#ddd6fe" text-anchor="middle">PENDING · AI MODERATION</text>
  <text x="68" y="60" font-size="12" fill="#71717a">just now</text>
  <text x="32" y="96" font-size="15" fill="#f4f4f5">Hello from the WallAI demo! Watching GenLayer validators moderate this post live.</text>
  <g font-size="11">
    <rect x="32" y="116" width="72" height="20" rx="10" fill="#10b981" fill-opacity="0.16"/>
    <text x="68" y="130" fill="#a7f3d0" text-anchor="middle">✓ Pending</text>
    <rect x="110" y="116" width="84" height="20" rx="10" fill="#10b981" fill-opacity="0.16"/>
    <text x="152" y="130" fill="#a7f3d0" text-anchor="middle">✓ Proposing</text>
    <rect x="200" y="116" width="96" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.22" stroke="#a78bfa" stroke-opacity="0.5"/>
    <circle cx="214" cy="126" r="3" fill="#c4b5fd"><animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="256" y="130" fill="#ede9fe" text-anchor="middle">Committing</text>
    <rect x="302" y="116" width="76" height="20" rx="10" fill="#ffffff" fill-opacity="0.05"/>
    <text x="340" y="130" fill="#71717a" text-anchor="middle">Revealing</text>
    <rect x="384" y="116" width="74" height="20" rx="10" fill="#ffffff" fill-opacity="0.05"/>
    <text x="421" y="130" fill="#71717a" text-anchor="middle">Accepted</text>
    <rect x="464" y="116" width="76" height="20" rx="10" fill="#ffffff" fill-opacity="0.05"/>
    <text x="502" y="130" fill="#71717a" text-anchor="middle">Finalized</text>
  </g>
  <text x="32" y="160" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#71717a">tx 0xea5637d5…  ↗  (status streamed from getTransaction().statusName every 2 s)</text>
</svg>
